name: GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - "site-next/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    env:
      PAGES_TOKEN: ${{ secrets.PAGES_TOKEN }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable pnpm via corepack
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate

      - name: Install dependencies
        working-directory: site-next
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: site-next
        run: pnpm build

      - name: SPA fallback (copy index.html -> 404.html)
        run: cp site-next/dist/index.html site-next/dist/404.html

      - name: Configure Pages
        if: env.PAGES_TOKEN == ''
        uses: actions/configure-pages@v5

      - name: Enable and configure Pages
        if: env.PAGES_TOKEN != ''
        uses: actions/configure-pages@v5
        with:
          enablement: true
          token: ${{ env.PAGES_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site-next/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
