<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>First setup - NerdGate Hub</title>
    <link rel="icon" href="/static/logo.png">
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card auth-card" aria-labelledby="setup-title">
        <div class="auth-mark">
          <img src="/static/logo.png" alt="" aria-hidden="true">
        </div>
        <p class="auth-brand">NERDGATE HUB</p>
        <h1 id="setup-title" class="auth-title">First setup</h1>
        <p class="lead auth-lead">Paste the setup token from the installer, then create the first admin account.</p>

        <ol class="onboarding-steps" aria-label="Setup steps">
          <li><span>1</span>DNS checked by installer</li>
          <li><span>2</span>Setup token issued</li>
          <li><span>3</span>Admin account created here</li>
        </ol>

        {{ if .Error }}
        <div class="notice error">{{ .Error }}</div>
        {{ end }}

        <form class="login-form" method="post" action="/setup">
          <input name="_csrf" type="hidden" value="{{ .CSRFToken }}">

          <label>
            Setup token
            <input name="setup_token" type="password" autocomplete="one-time-code" autofocus required>
          </label>

          <label>
            Admin username
            <input name="username" type="text" autocomplete="username" value="admin" required>
          </label>

          <label>
            Admin password
            <input name="password" type="password" autocomplete="new-password" required>
          </label>

          <label>
            Confirm password
            <input name="confirm_password" type="password" autocomplete="new-password" required>
          </label>

          <button type="submit" data-loading-label="Creating...">Create admin</button>
        </form>
      </section>
    </main>
  </body>
</html>
