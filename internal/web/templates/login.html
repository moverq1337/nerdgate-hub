<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sign in - NerdGate Hub</title>
    <link rel="icon" href="/static/logo.png">
    <link rel="stylesheet" href="/static/app.css">
    <script src="/static/app.js" defer></script>
  </head>
  <body class="login-page">
    <main class="login-shell">
      <section class="login-card auth-card" aria-labelledby="login-title">
        <div class="auth-mark">
          <img src="/static/logo.png" alt="" aria-hidden="true">
        </div>
        <p class="auth-brand">NERDGATE HUB</p>
        <h1 id="login-title" class="auth-title">Sign in</h1>
        <p class="lead auth-lead">Your routes live behind one clean admin door.</p>

        {{ if .Error }}
        <div class="notice error">{{ .Error }}</div>
        {{ end }}

        <form class="login-form" method="post" action="/login">
          <input name="next" type="hidden" value="{{ .Next }}">
          <input name="_csrf" type="hidden" value="{{ .CSRFToken }}">

          <label>
            Username
            <input name="username" type="text" autocomplete="username" autofocus required>
          </label>

          <label>
            Password
            <input name="password" type="password" autocomplete="current-password" required>
          </label>

          <button type="submit" data-loading-label="Checking...">Enter Hub</button>
        </form>
      </section>
    </main>
  </body>
</html>
