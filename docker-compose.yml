services:
  traefik:
    image: traefik:v3.1
    restart: unless-stopped
    command:
      - --api.dashboard=false
      - --entryPoints.web.address=:80
      - --entryPoints.web.http.redirections.entryPoint.to=websecure
      - --entryPoints.web.http.redirections.entryPoint.scheme=https
      - --entryPoints.websecure.address=:443
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --certificatesResolvers.letsencrypt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in .env}
      - --certificatesResolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesResolvers.letsencrypt.acme.httpChallenge.entryPoint=web
    ports:
      - "80:80"
      - "443:443"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/traefik:/etc/traefik/dynamic:ro
      - ./data/acme:/letsencrypt
    networks:
      - nerdgate-proxy

  nerdgate-hub:
    image: ghcr.io/moverq1337/nerdgate-hub:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NERDGATE_ADDR: ":8080"
      NERDGATE_DATA_DIR: /data
      NERDGATE_TRAEFIK_DYNAMIC_PATH: /traefik-dynamic/routes.yml
      NERDGATE_DOCKER_SOCKET: /var/run/docker.sock
      NERDGATE_DOCKER_PROXY_NETWORK: nerdgate-proxy
      NERDGATE_SESSION_SECRET: "${NERDGATE_SESSION_SECRET:-}"
      NERDGATE_USERNAME: "${NERDGATE_USERNAME:-admin}"
      NERDGATE_PASSWORD: "${NERDGATE_PASSWORD:?Set NERDGATE_PASSWORD in .env}"
    volumes:
      - ./data/app:/data
      - ./data/traefik:/traefik-dynamic
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - nerdgate-proxy

networks:
  nerdgate-proxy:
    name: nerdgate-proxy
